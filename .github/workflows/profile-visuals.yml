name: Generate Koi and Sakura Garden

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Sakura Grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sakura-garden.svg?palette=github-light&color_snake=#52b788&color_dots=#161b22,#ffccd5,#ffb3c1,#ff758f,#c9184a

      - name: Generate Git-Koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-dir: koi

      - name: Commit and Push Visuals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update sakura garden and git-koi" && git pull --rebase && git push)
