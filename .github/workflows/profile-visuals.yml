name: Generate Space Koi and Connected Stem Sakura Grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git-Koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-dir: koi

      - name: Composite Koi over space.gif & Build Connected Stem Sakura Grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick python3-pil python3-requests
          convert koi/koi.gif -coalesce koi/koi-full.gif

          python3 - << 'EOF'
          import os, requests
          from PIL import Image, ImageSequence

          # 1. Composite Koi directly over space.gif
          koi_im = Image.open("koi/koi-full.gif")
          W, H = koi_im.size
          koi_frames = [f.convert("RGBA") for f in ImageSequence.Iterator(koi_im)]
          durations = [f.info.get("duration", 80) for f in ImageSequence.Iterator(koi_im)]

          if os.path.exists("space.gif"):
              space_im = Image.open("space.gif")
              space_frames = [f.convert("RGBA").resize((W, H), Image.Resampling.LANCZOS) for f in ImageSequence.Iterator(space_im)]
          else:
              # Fallback dark space canvas if space.gif is not uploaded yet
              space_frames = [Image.new("RGBA", (W, H), (5, 5, 12, 255))]

          out_frames = []
          for i, k_frame in enumerate(koi_frames):
              bg_frame = space_frames[i % len(space_frames)].copy()
              combined = Image.alpha_composite(bg_frame, k_frame)
              out_frames.append(combined.convert("P", palette=Image.ADAPTIVE))

          out_frames[0].save(
              "koi/space-koi.gif",
              save_all=True,
              append_images=out_frames[1:],
              duration=durations,
              loop=0,
              disposal=2
          )

          # 2. Connected Green Stem Lattice + Blooming Sakura Flowers SVG
          user = os.environ["USERNAME"]
          token = os.environ["GITHUB_TOKEN"]
          q = """query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount } } } } } }"""
          r = requests.post("https://api.github.com/graphql", json={"query": q, "variables": {"login": user}}, headers={"Authorization": f"Bearer {token}"}).json()
          weeks = r["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cell, gap, pad = 13, 3, 16
          step = cell + gap
          sw = pad * 2 + len(weeks) * step
          sh = pad * 2 + 7 * step

          svg = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {sw} {sh}" width="100%">']
          svg.append('<rect width="100%" height="100%" rx="8" fill="#050508" stroke="#181a24" stroke-width="1"/>')

          # Draw continuous horizontal and vertical green stems connecting all squares
          x_start = pad + cell / 2
          x_end = pad + (len(weeks) - 1) * step + cell / 2
          for d in range(7):
              y = pad + d * step + cell / 2
              svg.append(f'<line x1="{x_start}" y1="{y}" x2="{x_end}" y2="{y}" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round"/>')

          for wi, w in enumerate(weeks):
              days_len = len(w["contributionDays"])
              if days_len > 0:
                  x = pad + wi * step + cell / 2
                  y_top = pad + cell / 2
                  y_bot = pad + (days_len - 1) * step + cell / 2
                  svg.append(f'<line x1="{x}" y1="{y_top}" x2="{x}" y2="{y_bot}" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round"/>')

          # Draw green stem leaf nodes on empty days and blooming sakura flowers on commit days
          for wi, w in enumerate(weeks):
              for di, d in enumerate(w["contributionDays"]):
                  c = d["contributionCount"]
                  x = pad + wi * step + cell / 2
                  y = pad + di * step + cell / 2
                  if c == 0:
                      # Connected green stem node with tiny leaf bud
                      svg.append(f'<circle cx="{x}" cy="{y}" r="2.5" fill="#40916c" stroke="#1b4332" stroke-width="1"/>')
                  else:
                      # 5-petal blooming sakura flower right on top of the green stems
                      petal = "#ff2a6d" if c >= 4 else ("#ff5c8a" if c >= 2 else "#ff8fa3")
                      core = "#fff0f3" if c < 4 else "#ffccd5"
                      svg.append(f'<g transform="translate({x},{y})">')
                      for angle in [0, 72, 144, 216, 288]:
                          svg.append(f'<ellipse cx="0" cy="-3.8" rx="2.3" ry="3.8" fill="{petal}" transform="rotate({angle})"/>')
                      svg.append(f'<circle cx="0" cy="0" r="1.8" fill="{core}"/>')
                      svg.append('</g>')

          svg.append('</svg>')
          with open("koi/stem-sakura.svg", "w") as f:
              f.write("\n".join(svg))
          EOF
          rm -f koi/koi-full.gif koi/koi-pond.gif koi/cyber-pond.gif koi/dark-sakura.svg

      - name: Commit and Push Visuals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update space koi and connected green stem sakura" && git pull --rebase && git push)
