name: Generate Dark Koi and Grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git-Koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-dir: koi

      - name: Build Unified Dark Pond & Grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick python3-pil python3-requests
          convert koi/koi.gif -coalesce koi/koi-full.gif

          python3 - << 'EOF'
          import os, requests
          from PIL import Image, ImageDraw, ImageSequence

          # 1. Midnight Pond matching the pitch-black butterfly background
          im = Image.open("koi/koi-full.gif")
          koi_w, koi_h = im.size
          W, H = int(koi_w * 1.6), int(koi_h * 1.1)
          ox, oy = (W - koi_w) // 2, (H - koi_h) // 2

          bg = Image.new("RGBA", (W, H), (5, 5, 8, 255))
          draw = ImageDraw.Draw(bg)

          # Subtle dark cyber/chromatic ripples matching the RGB butterfly
          ripples = [
              (0.25, 0.35, 24, (255, 42, 109, 55)),
              (0.75, 0.65, 30, (5, 217, 232, 50)),
              (0.50, 0.50, 44, (120, 120, 140, 35))
          ]
          for (rx, ry, rad, col) in ripples:
              cx, cy = int(W * rx), int(H * ry)
              draw.ellipse([cx-rad, cy-rad, cx+rad, cy+rad], outline=col, width=1)

          # Minimal crimson/sakura petals on dark water
          for (px, py) in [(0.18, 0.25), (0.82, 0.28), (0.22, 0.78), (0.78, 0.75)]:
              x, y = int(W * px), int(H * py)
              draw.ellipse([x-2, y-2, x+2, y+2], fill=(255, 42, 109, 200))

          frames, durations = [], []
          for frame in ImageSequence.Iterator(im):
              canvas = bg.copy()
              f_rgba = frame.convert("RGBA")
              canvas.paste(f_rgba, (ox, oy), f_rgba)
              frames.append(canvas.convert("P", palette=Image.ADAPTIVE))
              durations.append(frame.info.get("duration", 80))

          frames[0].save("koi/koi-pond.gif", save_all=True, append_images=frames[1:], duration=durations, loop=0, disposal=2)

          # 2. Matching Dark-Mode Sakura Contribution Grid
          user = os.environ["USERNAME"]
          token = os.environ["GITHUB_TOKEN"]
          q = """query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount } } } } } }"""
          r = requests.post("https://api.github.com/graphql", json={"query": q, "variables": {"login": user}}, headers={"Authorization": f"Bearer {token}"}).json()
          weeks = r["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cell, gap, pad = 11, 3, 14
          sw = pad * 2 + len(weeks) * (cell + gap)
          sh = pad * 2 + 7 * (cell + gap)

          svg = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {sw} {sh}" width="100%">']
          svg.append('<rect width="100%" height="100%" rx="6" fill="#050508"/>')

          for wi, w in enumerate(weeks):
              for di, d in enumerate(w["contributionDays"]):
                  c = d["contributionCount"]
                  x = pad + wi * (cell + gap)
                  y = pad + di * (cell + gap)
                  if c == 0:
                      svg.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="#12131a"/>')
                  else:
                      col = "#7a1c3a" if c <= 2 else ("#d90452" if c <= 5 else "#ff2a6d")
                      svg.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{col}"/>')

          svg.append('</svg>')
          with open("koi/dark-sakura.svg", "w") as f:
              f.write("\n".join(svg))
          EOF
          rm -f koi/koi-full.gif
          rm -rf dist profile-3d-contrib

      - name: Commit and Push Visuals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Unify dark theme visuals" && git pull --rebase && git push)
