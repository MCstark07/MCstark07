name: Generate Git-Koi Pond

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git-Koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-dir: koi

      - name: Add Pond Water Background to Koi GIF
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          # Get dimensions of the generated koi.gif
          DIM=$(identify -format "%wx%h" koi/koi.gif[0])
          # Create a tranquil pond water canvas with ripples and floating sakura petals
          convert -size $DIM radial-gradient:'#1b4332-#081c15' \
            -fill none -stroke '#2d6a4f' -strokewidth 1 \
            -draw "circle 70,70 70,95 circle 180,160 180,190" \
            -fill '#ffb3c1' -stroke none \
            -draw "circle 45,40 45,43 circle 210,65 210,68 circle 60,195 60,198 circle 195,215 195,218" \
            koi/pond-bg.png
          # Layer the animated koi over the water background
          convert koi/koi.gif -coalesce null: koi/pond-bg.png -compose DstOver -layers composite -layers optimize koi/koi-pond.gif
          rm koi/pond-bg.png

      - name: Commit and Push Visuals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update koi pond" && git pull --rebase && git push)
