name: Generate Space Koi and Organic Sakura Vines

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git-Koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-dir: koi

      - name: Composite Koi over space.gif & Build Organic Wavy Sakura Grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick python3-pil python3-requests
          convert koi/koi.gif -coalesce koi/koi-full.gif

          python3 - << 'EOF'
          import os, math, requests
          from PIL import Image, ImageSequence

          # 1. Composite Koi directly over space.gif
          koi_im = Image.open("koi/koi-full.gif")
          W, H = koi_im.size
          koi_frames = [f.convert("RGBA") for f in ImageSequence.Iterator(koi_im)]
          durations = [f.info.get("duration", 80) for f in ImageSequence.Iterator(koi_im)]

          if os.path.exists("space.gif"):
              space_im = Image.open("space.gif")
              space_frames = [f.convert("RGBA").resize((W, H), Image.Resampling.LANCZOS) for f in ImageSequence.Iterator(space_im)]
          else:
              space_frames = [Image.new("RGBA", (W, H), (5, 5, 12, 255))]

          out_frames = []
          for i, k_frame in enumerate(koi_frames):
              bg_frame = space_frames[i % len(space_frames)].copy()
              combined = Image.alpha_composite(bg_frame, k_frame)
              out_frames.append(combined.convert("P", palette=Image.ADAPTIVE))

          out_frames[0].save(
              "koi/space-koi-v2.gif",
              save_all=True,
              append_images=out_frames[1:],
              duration=durations,
              loop=0,
              disposal=2
          )

          # 2. Organic Wavy Vines + Sprouting Leaves + Blooming Sakura Flowers SVG
          user = os.environ["USERNAME"]
          token = os.environ["GITHUB_TOKEN"]
          q = """query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount } } } } } }"""
          r = requests.post("https://api.github.com/graphql", json={"query": q, "variables": {"login": user}}, headers={"Authorization": f"Bearer {token}"}).json()
          weeks = r["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cell, gap, pad = 13, 3, 16
          step = cell + gap
          sw = pad * 2 + len(weeks) * step
          sh = pad * 2 + 7 * step

          svg = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {sw} {sh}" width="100%">']
          svg.append('<rect width="100%" height="100%" rx="8" fill="#050508" stroke="#181a24" stroke-width="1"/>')

          # Horizontal wavy vines using quadratic Bezier curves
          for d in range(7):
              y = pad + d * step + cell / 2
              x0 = pad + cell / 2
              path_d = [f"M {x0} {y}"]
              for wi in range(len(weeks) - 1):
                  x1 = pad + wi * step + cell / 2
                  x2 = pad + (wi + 1) * step + cell / 2
                  cx = (x1 + x2) / 2
                  amp = 3.8 if (wi + d) % 2 == 0 else -3.8
                  cy = y + amp
                  path_d.append(f"Q {cx} {cy}, {x2} {y}")
              svg.append(f'<path d="{" ".join(path_d)}" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-linecap="round"/>')

          # Vertical wavy vines connecting rows
          for wi, w in enumerate(weeks):
              days_len = len(w["contributionDays"])
              if days_len > 1:
                  x = pad + wi * step + cell / 2
                  y0 = pad + cell / 2
                  path_v = [f"M {x} {y0}"]
                  for di in range(days_len - 1):
                      y1 = pad + di * step + cell / 2
                      y2 = pad + (di + 1) * step + cell / 2
                      cy = (y1 + y2) / 2
                      amp = 3.2 if (wi + di) % 2 == 0 else -3.2
                      cx = x + amp
                      path_v.append(f"Q {cx} {cy}, {x} {y2}")
                  svg.append(f'<path d="{" ".join(path_v)}" fill="none" stroke="#1b4332" stroke-width="1.6" stroke-linecap="round"/>')

          # Sprouting leaves on empty nodes & 5-petal sakura blossoms on commit days
          for wi, w in enumerate(weeks):
              for di, d in enumerate(w["contributionDays"]):
                  c = d["contributionCount"]
                  x = pad + wi * step + cell / 2
                  y = pad + di * step + cell / 2
                  jx = math.sin(wi * 1.7 + di * 2.3) * 1.2
                  jy = math.cos(wi * 2.1 + di * 1.3) * 1.2
                  nx, ny = round(x + jx, 1), round(y + jy, 1)

                  if c == 0:
                      seed = (wi * 31 + di * 17) % 10
                      if seed in (0, 2, 5, 8):
                          angle = -38 if (wi + di) % 2 == 0 else 42
                          svg.append(f'<g transform="translate({nx},{ny}) rotate({angle})">')
                          svg.append('<path d="M 0,0 C 3,-4.2 7.5,-4.2 9.5,0 C 7.5,4.2 3,4.2 0,0 Z" fill="#52b788"/>')
                          svg.append('<line x1="0" y1="0" x2="7.5" y2="0" stroke="#1b4332" stroke-width="0.8"/>')
                          svg.append('</g>')
                      elif seed in (3, 6):
                          svg.append(f'<g transform="translate({nx},{ny})">')
                          svg.append('<ellipse cx="-2.5" cy="-2.2" rx="3.2" ry="1.5" fill="#40916c" transform="rotate(-35 -2.5 -2.2)"/>')
                          svg.append('<ellipse cx="2.5" cy="2.2" rx="3.2" ry="1.5" fill="#74c69d" transform="rotate(35 2.5 2.2)"/>')
                          svg.append('</g>')
                      else:
                          svg.append(f'<circle cx="{nx}" cy="{ny}" r="2" fill="#2d6a4f"/>')
                  else:
                      petal = "#ff2a6d" if c >= 4 else ("#ff5c8a" if c >= 2 else "#ff8fa3")
                      core = "#fff0f3" if c < 4 else "#ffccd5"
                      svg.append(f'<g transform="translate({nx},{ny})">')
                      svg.append('<ellipse cx="-3.5" cy="2.5" rx="3.5" ry="1.5" fill="#52b788" transform="rotate(-30 -3.5 2.5)"/>')
                      svg.append('<ellipse cx="3.5" cy="-2.5" rx="3.5" ry="1.5" fill="#40916c" transform="rotate(-30 3.5 -2.5)"/>')
                      for angle in [0, 72, 144, 216, 288]:
                          svg.append(f'<ellipse cx="0" cy="-3.8" rx="2.3" ry="3.8" fill="{petal}" transform="rotate({angle})"/>')
                      svg.append(f'<circle cx="0" cy="0" r="1.8" fill="{core}"/>')
                      svg.append('</g>')

          svg.append('</svg>')
          with open("koi/organic-sakura.svg", "w") as f:
              f.write("\n".join(svg))
          EOF
          rm -f koi/koi-full.gif koi/space-koi.gif koi/stem-sakura.svg koi/dark-sakura.svg

      - name: Commit and Push Visuals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Build organic wavy sakura vines v2" && git pull --rebase && git push)
